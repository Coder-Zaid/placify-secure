<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A1A1E" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#16a34a" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#darkGrad)" stroke="#27272A" stroke-width="1.5" />

  <!-- Outer Shield Contour -->
  <path d="M32 10 L48 16 C48 30 42 43 32 50 C22 43 16 30 16 16 Z" 
        fill="none" 
        stroke="url(#shieldGrad)" 
        stroke-width="2.5" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Inner P Monogram & Integrity Check -->
  <path d="M26 21 L35 21 C38.5 21 41 23.2 41 26.5 C41 29.8 38.5 32 35 32 L26 32 Z" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="3" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
        
  <path d="M26 21 L26 43" 
        stroke="#FFFFFF" 
        stroke-width="3" 
        stroke-linecap="round"/>

  <!-- Small Shield Security Node in Emerald -->
  <circle cx="32" cy="46" r="2.5" fill="#22c55e" />
</svg>