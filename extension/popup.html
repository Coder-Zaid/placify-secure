<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <div class="header">
      <div class="logo">PLACIFY</div>
      <div class="subtitle">SECURE ASSESSMENT MONITOR</div>
    </div>
    
    <div id="no-exam" class="state-container active">
      <div class="icon-wrap">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 9.9-1"></path>
        </svg>
      </div>
      <div class="text-content">
        <p class="main-text">Monitor Disconnected / Idle</p>
        <p class="sub-text">Open or focus a Placify assessment tab to link this extension.</p>
      </div>
    </div>

    <div id="active-exam" class="state-container">
      <div class="exam-header">
        <div id="exam-title" class="exam-title">Aptitude Assessment</div>
        <div id="connection-status" class="connection-status">● Linked & Active</div>
      </div>
      
      <div class="stats-grid">
        <div class="stat-box">
          <div class="stat-label">Time Remaining</div>
          <div id="time-left" class="stat-value">00:00</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Warnings Logged</div>
          <div id="warning-count" class="stat-value">0/1</div>
        </div>
      </div>

      <div class="alert-box">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="alert-icon">
          <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
          <line x1="12" y1="9" x2="12" y2="13"></line>
          <line x1="12" y1="17" x2="12.01" y2="17"></line>
        </svg>
        <span>Exiting browser fullscreen or switching tabs will invalidate the session.</span>
      </div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
