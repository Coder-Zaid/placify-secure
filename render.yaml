databases:
  - name: placify-db
    plan: free
    databaseName: placify_secure
    user: placify_user

services:
  - type: web
    name: placify-secure-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: placify-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.9
